# ==========================================
# PROD Profile Configuration
# Activated by: SPRING_PROFILES_ACTIVE=prod
# ALL sensitive values MUST be supplied via environment variables.
# Do NOT hard-code credentials here.
# ==========================================

# ── Database ───────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection pool tuning (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000


# ── JPA / Hibernate ────────────────────────────────────────────────────────────
# validate: Flyway owns the schema; Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.javax.persistence.query.timeout=5000

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.ecommerce.mvp=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.security=WARN
# Write logs as JSON for log-aggregation pipelines (ELK / CloudWatch / Loki)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [PROD] ${PID:- } --- [%15.15t] %-40.40logger{39} : %m%n

# ── Security / JWT ─────────────────────────────────────────────────────────────
# No fallback: application will refuse to start if JWT_SECRET env var is not set
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# ── Swagger / OpenAPI ──────────────────────────────────────────────────────────
# Disable API docs in production – prevents information disclosure
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ── Cache ──────────────────────────────────────────────────────────────────────
# Redis is the distributed cache provider in production
spring.data.redis.timeout=2000ms
spring.data.redis.repositories.enabled=false
spring.cache.type=redis
#spring.cache.redis.key-prefix=ecommerce:
#spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=false
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

# ── Flyway ─────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.schemas=${DB_SCHEMA}
# In prod, out-of-order migrations are not allowed
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
# Trust reverse-proxy / load-balancer forwarded headers
server.forward-headers-strategy=framework

# ── Actuator ───────────────────────────────────────────────────────────────────
# Expose only health & info; protect them behind management port or security
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.server.port=${MANAGEMENT_PORT:8081}

# ── SMTP (prod only) ───────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Email / Password Reset ─────────────────────────────────────────────────────
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.mail.from=${MAIL_FROM:noreply@nexus.ecommerce}
