# ==========================================
# PROD Profile Configuration
# Activated by: SPRING_PROFILES_ACTIVE=prod
# ALL sensitive values MUST be supplied via environment variables.
# Do NOT hard-code credentials here.
# ==========================================

# ── Database ───────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection pool tuning (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
# validate: Flyway owns the schema; Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.ecommerce.mvp=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.security=WARN
# Write logs as JSON for log-aggregation pipelines (ELK / CloudWatch / Loki)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [PROD] ${PID:- } --- [%15.15t] %-40.40logger{39} : %m%n

# ── Security / JWT ─────────────────────────────────────────────────────────────
# No fallback: application will refuse to start if JWT_SECRET env var is not set
app.jwt.secret=${JWT_SECRET}

# ── Swagger / OpenAPI ──────────────────────────────────────────────────────────
# Disable API docs in production – prevents information disclosure
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ── Cache ──────────────────────────────────────────────────────────────────────
# Redis is the distributed cache provider in production
spring.cache.type=redis
spring.cache.redis.key-prefix=ecommerce:
spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=false
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

# ── Flyway ─────────────────────────────────────────────────────────────────────
spring.flyway.schemas=${DB_SCHEMA:ecommerce}
# In prod, out-of-order migrations are not allowed
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
# Trust reverse-proxy / load-balancer forwarded headers
server.forward-headers-strategy=framework

# ── Actuator ───────────────────────────────────────────────────────────────────
# Expose only health & info; protect them behind management port or security
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.server.port=${MANAGEMENT_PORT:8081}

