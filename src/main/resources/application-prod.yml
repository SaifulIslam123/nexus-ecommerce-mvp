# ==========================================
# PROD Profile Configuration
# Activated by: SPRING_PROFILES_ACTIVE=prod
# ALL sensitive values MUST be supplied via environment variables.
# Do NOT hard-code credentials here.
# ==========================================

# ── Server ─────────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  # Trust reverse-proxy / load-balancer forwarded headers
  forward-headers-strategy: framework

# ── Spring Framework Settings ──────────────────────────────────────────────────
spring:
  # ── Database ───────────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # Connection pool tuning (HikariCP)
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # ── JPA / Hibernate ────────────────────────────────────────────────────────────
  # validate: Flyway owns the schema; Hibernate only checks it matches the entities
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
      javax:
        persistence:
          query:
            timeout: 5000

  # ── Cache ──────────────────────────────────────────────────────────────────────
  # Redis is the distributed cache provider in production
  cache:
    type: redis
    redis:
      # key-prefix: "ecommerce:"
      # use-key-prefix: true
      cache-null-values: false

  # ── Redis connection ───────────────────────────────────────────────────────────
  data:
    redis:
      timeout: 2000ms
      repositories:
        enabled: false
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  # ── Flyway ─────────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    schemas: ${DB_SCHEMA}
    # In prod, out-of-order migrations are not allowed
    out-of-order: false
    validate-on-migrate: true

  # ── SMTP (prod only) ───────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ── Logging ────────────────────────────────────────────────────────────────────
logging:
  level:
    root: WARN
    com:
      ecommerce:
        mvp: INFO
    org:
      hibernate:
        SQL: "OFF"
        orm:
          jdbc:
            bind: "OFF"
      springframework:
        security: WARN
  # Write logs as JSON for log-aggregation pipelines (ELK / CloudWatch / Loki)
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [PROD] ${PID:- } --- [%15.15t] %-40.40logger{39} : %m%n"

# ── Swagger / OpenAPI ──────────────────────────────────────────────────────────
# Disable API docs in production – prevents information disclosure
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# ── Actuator ───────────────────────────────────────────────────────────────────
# Expose only health & info; protect them behind management port or security
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  server:
    port: ${MANAGEMENT_PORT:8081}

# ── Custom Application Configuration ───────────────────────────────────────────
app:
  # ── Security / JWT ─────────────────────────────────────────────────────────────
  # No fallback: application will refuse to start if JWT_SECRET env var is not set
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
  # ── Email / Password Reset ─────────────────────────────────────────────────────
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@nexus.ecommerce}
