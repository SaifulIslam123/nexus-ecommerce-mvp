spring.application.name=ecommerce

# MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=localhost@123456


# Hibernate JPA properties (optional, but commonly used)
spring.jpa.hibernate.ddl-auto=update
# Force Hibernate to send/receive all timestamps as UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Logs the SQL queries
#logging.level.org.hibernate.SQL=DEBUG

# For Hibernate 6+ (Spring Boot 3+): Logs the parameter bindings
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Optional: Formats the SQL nicely for better readability
spring.jpa.properties.hibernate.format_sql=true

# Optional: Writes the SQL to the standard output (alternative to logging.level.org.hibernate.SQL)
spring.jpa.show-sql=true

spring.main.banner-mode=OFF

logging.level.root = warn