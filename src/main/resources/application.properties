spring.application.name=ecommerce

# MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=localhost@123456


# Hibernate JPA properties (optional, but commonly used)
spring.jpa.hibernate.ddl-auto=update
# Force Hibernate to send/receive all timestamps as UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Logs the SQL queries
#logging.level.org.hibernate.SQL=DEBUG

# For Hibernate 6+ (Spring Boot 3+): Logs the parameter bindings
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Optional: Formats the SQL nicely for better readability
spring.jpa.properties.hibernate.format_sql=true

# Optional: Writes the SQL to the standard output (alternative to logging.level.org.hibernate.SQL)
spring.jpa.show-sql=true

spring.main.banner-mode=OFF
# Springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# Public swagger paths - used by SecurityConfig and ResponseWrapperAdvice
swagger.public-paths=${springdoc.api-docs.path},${springdoc.api-docs.path}/**,${springdoc.api-docs.path}.yaml,${springdoc.swagger-ui.path}.html,${springdoc.swagger-ui.path}/**,/swagger-resources/**,/webjars/**

logging.level.root = warn

# ── Redis Cache ───────────────────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=           # uncomment if Redis auth is enabled
spring.data.redis.timeout=2000ms

# Use Redis as the Spring Cache provider
spring.cache.type=redis
# Global key prefix for all cache entries – helps avoid key collisions in shared Redis
spring.cache.redis.key-prefix=ecommerce:
spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=false
