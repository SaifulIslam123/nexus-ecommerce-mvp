# ==========================================
# Base / Shared Configuration
# Only settings that are truly identical across ALL environments live here.
# Credentials and connection details belong in the profile-specific files.
# Active profile: set via SPRING_PROFILES_ACTIVE env var or -Dspring.profiles.active=prod
# ==========================================
spring.application.name=ecommerce
spring.profiles.active=dev

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway ─────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true

# ── Redis ──────────────────────────────────────────────────────────────────────
spring.data.redis.timeout=2000ms
spring.data.redis.repositories.enabled=false

# ── Security / JWT ─────────────────────────────────────────────────────────────
# Override via JWT_SECRET env var in production (must be Base64-encoded 256-bit key)
app.jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# ── Springdoc / Swagger UI ─────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

# Public swagger paths - used by SecurityConfig and ResponseWrapperAdvice
swagger.public-paths=${springdoc.api-docs.path},${springdoc.api-docs.path}/**,${springdoc.api-docs.path}.yaml,${springdoc.swagger-ui.path}.html,${springdoc.swagger-ui.path}/**,/swagger-resources/**,/webjars/**

# ── Banner ─────────────────────────────────────────────────────────────────────
spring.main.banner-mode=OFF
