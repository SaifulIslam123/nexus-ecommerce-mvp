# ==========================================
# DEV Profile Configuration
# Activated by: SPRING_PROFILES_ACTIVE=dev  (default)
# ==========================================

# ── Database ───────────────────────────────────────────────────────────────────
# Use a dedicated dev schema to keep data separate from prod
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=localhost@123456

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
# update is convenient in dev – schema evolves with entity changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.ecommerce.mvp=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([DEV]){cyan} %clr(${PID:- }){magenta} --- [%15.15t] %clr(%-40.40logger{39}){cyan} : %m%n

# ── Swagger / OpenAPI ──────────────────────────────────────────────────────────
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ── Cache ──────────────────────────────────────────────────────────────────────
# Disable Redis cache in dev so no Redis instance is needed locally
spring.cache.type=none

# ── Redis connection (only needed if spring.cache.type is changed to redis locally) ──
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ── Flyway ─────────────────────────────────────────────────────────────────────
spring.flyway.schemas=ecommerce_dev

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=8080
