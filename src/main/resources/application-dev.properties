# ==========================================
# DEV Profile Configuration
# Activated by: SPRING_PROFILES_ACTIVE=dev  (default)
# ==========================================

# ── Security / JWT ─────────────────────────────────────────────────────────────
# Override via JWT_SECRET env var in production (must be Base64-encoded 256-bit key)
app.jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# ── Database ───────────────────────────────────────────────────────────────────
# Use a dedicated dev schema to keep data separate from prod
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=localhost@123456

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
# update is convenient in dev – schema evolves with entity changes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.ecommerce.mvp=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([DEV]){cyan} %clr(${PID:- }){magenta} --- [%15.15t] %clr(%-40.40logger{39}){cyan} : %m%n

# ── Swagger / OpenAPI ──────────────────────────────────────────────────────────
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
# Public swagger paths - used by SecurityConfig and ResponseWrapperAdvice
swagger.public-paths=${springdoc.api-docs.path},${springdoc.api-docs.path}/**,${springdoc.api-docs.path}.yaml,${springdoc.swagger-ui.path}.html,${springdoc.swagger-ui.path}/**,/swagger-resources/**,/webjars/**

# ── Cache ──────────────────────────────────────────────────────────────────────
# Disable Redis cache in dev so no Redis instance is needed locally
spring.cache.type=none

# ── Redis connection (only needed if spring.cache.type is changed to redis locally) ──
spring.data.redis.timeout=2000ms
spring.data.redis.repositories.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ── Flyway ─────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.schemas=ecommerce_dev

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=8080
